# One-click deploy to Render (free plan).
# In Render: New -> Blueprint -> point at this repo/branch.
services:
  - type: web
    name: stock-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set manually in the Render dashboard (secret)
      - key: DASHBOARD_USER
        sync: false          # basic-auth username for the public dashboard
      - key: DASHBOARD_PASSWORD
        sync: false          # basic-auth password
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-7
