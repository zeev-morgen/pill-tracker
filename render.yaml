# Deploy to Render — free plan.
# In Render: New → Blueprint → select this repo and branch.
#
# The database is NOT defined here on purpose: Render's free PostgreSQL is
# deleted after 30 days. Create a free Neon database instead (it does not
# expire) and paste its connection string into DATABASE_URL below.
# Full walkthrough: DEPLOY.md
services:
  - type: web
    name: stock-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    # Keep-alive pingers and Render's own probe hit this path; it is the one
    # route that stays reachable without a password.
    healthCheckPath: /health
    envVars:
      # ── Set these in the Render dashboard (never commit real values) ──
      - key: DATABASE_URL          # Neon connection string
        sync: false
      - key: DASHBOARD_USER        # dashboard login — required when public
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TIINGO_API_KEY       # live prices; see .env.example
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false
      # ── Fixed ──
      - key: PYTHON_VERSION
        value: "3.12"
